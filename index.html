 try{var s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(s);rec.ondataavailable=function(e){ch.push(e.data)};

 catch(e){err="Dale permiso al micrófono desde el candado de la barra del navegador";R()}}
